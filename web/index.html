<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Terminus</title>
    <meta name="description" content="Your life, in spheres — with an agent that lives there." />
    <meta name="theme-color" content="#eef0f4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0c10" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Terminus" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <script>
      // Apply the saved theme before first paint. "Follow the sun" (the default) picks the
      // phase of the day from today's changes, saved by web/src/sun.ts.
      try {
        var root = document.documentElement;
        var t = localStorage.getItem('terminus.theme') || localStorage.getItem('lifeos.theme');
        if (t === 'light' || t === 'dark') root.dataset.theme = t;
        else if (t !== 'system') {
          var m = JSON.parse(localStorage.getItem('terminus.sky.marks') || 'null');
          if (m && m.date === new Date().toDateString()) {
            var now = Date.now();
            var p = now >= m.evening ? 'evening' : now >= m.dusk ? 'dusk' : now >= m.day ? 'day' : now >= m.dawn ? 'dawn' : 'evening';
            root.dataset.phase = p;
            root.dataset.theme = p === 'dawn' || p === 'day' ? 'light' : 'dark';
          }
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
